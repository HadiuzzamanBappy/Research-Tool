<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Investment Memo</title>
    <style>
        :root {
            --bg: #f7f8fc;
            --panel: #ffffff;
            --text: #1c2430;
            --muted: #5a6677;
            --accent: #0b6bcb;
            --border: #dbe3ef;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Segoe UI, -apple-system, BlinkMacSystemFont, sans-serif;
            color: var(--text);
            background: radial-gradient(circle at top right, #dceeff 0%, var(--bg) 55%);
            line-height: 1.6;
        }

        .wrap {
            max-width: 900px;
            margin: 40px auto;
            padding: 0 16px;
        }

        .card {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(8, 24, 44, 0.08);
            padding: 28px;
        }

        h1 {
            margin: 0 0 18px;
            font-size: 1.8rem;
            color: var(--accent);
        }

        h2 {
            margin: 22px 0 10px;
            font-size: 1.2rem;
            color: #0e2f55;
            border-bottom: 1px solid var(--border);
            padding-bottom: 6px;
        }

        p {
            margin: 10px 0;
            color: var(--muted);
        }

        ul {
            margin: 8px 0 12px 22px;
        }

        li {
            margin: 6px 0;
        }

        .content {
            min-height: 200px;
        }

        .foot {
            margin-top: 20px;
            font-size: 0.9rem;
            color: #74839a;
        }
    </style>
</head>

<body>
    <main class="wrap">
        <section class="card">
            <div class="content">
                <!-- Report content will be inserted here -->
            </div>
            <div class="foot">Generated by Market Researcher</div>
        </section>
    </main>
</body>

</html>
